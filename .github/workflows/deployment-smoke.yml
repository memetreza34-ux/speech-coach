name: SpeechCoach Deployment Smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL of the deployed SpeechCoach instance
        required: true
        type: string
      expect_ai_configured:
        description: Require OPENAI_API_KEY to be configured in the deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: speechcoach-deployment-smoke-${{ inputs.target_url }}
  cancel-in-progress: true

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify deployed application
        env:
          SPEECHCOACH_TARGET_URL: ${{ inputs.target_url }}
          EXPECT_AI_CONFIGURED: ${{ inputs.expect_ai_configured }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:deployment
